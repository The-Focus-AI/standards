[tools]
node = "22"
"npm:pnpm" = "latest"
fnox = "latest"
gh = "latest"
ripgrep = "latest"
fd = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:skills" = "1.5.13"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "First-time local setup"
run = '''
set -euo pipefail
mkdir -p .fnox
chmod 700 .fnox
if [ ! -f .fnox/env ]; then
  touch .fnox/env
  chmod 600 .fnox/env
  echo "Created .fnox/env. Add OP_SERVICE_ACCOUNT_TOKEN or other local bootstrap values if needed."
else
  echo ".fnox/env already exists"
fi
'''

[tasks.install]
description = "Install project dependencies, pi packages, and locked agent skills"
run = '''
set -euo pipefail
if [ -f package.json ]; then
  pnpm install --frozen-lockfile || pnpm install
fi
# Not `skills experimental_install`. That command restores the lock but hardcodes
# its targets to the agents sharing .agents/skills/, and Claude Code reads project
# skills from .claude/skills/ only — so it reports success and leaves the agent
# with nothing. Install per source instead, naming the agent. See GDE-008.
# Each `skills add` gets its stdin from /dev/null. Piping the commands into `sh`
# instead looks tidier and silently installs only the first source: the CLI reads
# stdin, so it swallows the remaining commands off the pipe.
node -e '
  const { execFileSync } = require("node:child_process");
  const l = require("./skills-lock.json").skills, by = {};
  for (const [name, e] of Object.entries(l)) (by[e.source] ??= []).push(name);
  for (const [source, names] of Object.entries(by))
    execFileSync("skills", ["add", source, ...names.flatMap((n) => ["--skill", n]), "--agent", "claude-code", "-y"],
      { stdio: ["ignore", "inherit", "inherit"] });
'
'''

[tasks.dev]
description = "Run development checks"
run = '''
set -euo pipefail
mise run lint
mise run test
'''

[tasks.lint]
description = "Run linters"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*lint"; then
  pnpm run lint
elif command -v markdownlint-cli2 >/dev/null 2>&1; then
  markdownlint-cli2 "**/*.md" "#node_modules" "#.pi" "#.agents"
else
  echo "No linter configured yet"
fi
if [ -f fnox.toml ]; then
  fnox check
fi
'''

[tasks.test]
description = "Run tests/typechecks"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*test"; then
  pnpm run test
else
  echo "No test command configured yet"
fi
'''

[tasks.deploy]
description = "Build or deploy the project"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*build"; then
  pnpm run build
else
  echo "No deploy/build command configured yet"
fi
'''

[tasks."secrets:check"]
description = "Verify declared secrets resolve"
run = "fnox check"

[tasks."secrets:list"]
description = "List declared secrets"
run = "fnox list"
