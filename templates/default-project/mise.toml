[tools]
node = "22"
"npm:pnpm" = "10.34.9"
fnox = { version = "1.45.0", workflow = "release.yml" }
gh = "latest"
ripgrep = "latest"
fd = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "0.24.0"
"npm:skills" = "1.7.4"
op = "2.41.1"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "Check the bootstrap token injected into this cloud environment"
run = '''
set -eu
if [ ! -f fnox.toml ]; then
  echo "No fnox configuration yet; no bootstrap token is needed."
  exit 0
fi
if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
  echo "Set OP_SERVICE_ACCOUNT_TOKEN in this project's cloud secret settings using your 1Password account." >&2
  exit 1
fi
echo "Bootstrap token is available; run mise run secrets:check to verify access."
'''

[tasks.install]
description = "Install project dependencies and restore agent skills"
run = '''
set -eu
if [ -f package.json ]; then
  if [ -f pnpm-lock.yaml ]; then
    pnpm install --frozen-lockfile
  else
    pnpm install --no-frozen-lockfile
  fi
fi
node scripts/restore-skills.mjs
'''

[tasks.dev]
description = "Baseline checks; adapt to the project's real development loop"
run = '''
set -eu
mise run lint
mise run test
'''

[tasks.lint]
description = "Run the project linter; fail until a real check is configured"
run = '''
set -eu
if [ ! -f package.json ]; then
  echo "No lint command configured: adapt this baseline to the project brief." >&2
  exit 1
fi
pnpm run lint
'''

[tasks.test]
description = "Run project tests; do not report an untested scaffold as passing"
run = '''
set -eu
if [ ! -f package.json ]; then
  echo "No test command configured: add real behavior checks, not placeholder tests." >&2
  exit 1
fi
pnpm run test
'''

[tasks.deploy]
description = "Unconfigured release path; adapt explicitly before deployment"
run = '''
set -eu
echo "No deployment configured: record the target and approval gate before wiring CI." >&2
echo "For a non-deploying repository, replace this task with its explicit reason." >&2
exit 1
'''

[tasks."secrets:check"]
description = "Verify declared secrets resolve"
run = "fnox check"

[tasks."secrets:list"]
description = "List declared secrets"
run = "fnox list"
