[tools]
node = "22"
"npm:pnpm" = "10.34.9"
fnox = { version = "1.45.0", workflow = "release.yml" }
gh = "latest"
ripgrep = "latest"
fd = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "0.24.0"
"npm:skills" = "1.7.4"
op = "2.41.1"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "Get this checkout ready: a working 1Password token, then a secrets check"
run = '''
set -eu
if [ ! -f fnox.toml ]; then
  echo "No fnox configuration yet; no token is needed."
  exit 0
fi
OP_ACCOUNT_HOST="<org>.1password.com"
OP_VAULT="<Client> - <Project>"
OP_TOKEN_ITEM="<repo> service account token"

token_reads_vault() {
  [ -n "${OP_SERVICE_ACCOUNT_TOKEN:-}" ] && op vault get "$OP_VAULT" >/dev/null 2>&1
}

if token_reads_vault; then
  echo "✓ The service account token can read the project vault."
else
  echo "No working token here; fetching it with your own 1Password sign-in..."
  TOKEN="$(env -u OP_SERVICE_ACCOUNT_TOKEN op read "op://$OP_VAULT/$OP_TOKEN_ITEM/credential" --account "$OP_ACCOUNT_HOST" --no-newline 2>/dev/null || true)"
  if [ -z "$TOKEN" ]; then
    echo "Could not get the project token." >&2
    echo "  Cloud workspace: set OP_SERVICE_ACCOUNT_TOKEN in the project's cloud secret settings to the value of '$OP_TOKEN_ITEM', then restart the workspace." >&2
    echo "  Your own machine: sign in to $OP_ACCOUNT_HOST in the 1Password app, turn on its command-line integration, and ask an owner to add you to this project's group." >&2
    exit 1
  fi
  git check-ignore -q -- .fnox/env || { echo "STOP: .fnox/env is not ignored by git; not writing a token." >&2; exit 1; }
  if [ -n "$(git ls-files -- .fnox/env)" ]; then
    echo "STOP: .fnox/env is tracked by git; not writing a token." >&2
    exit 1
  fi
  umask 077
  mkdir -p .fnox
  chmod 700 .fnox
  printf 'OP_SERVICE_ACCOUNT_TOKEN=%s\n' "$TOKEN" > .fnox/env
  chmod 600 .fnox/env
  export OP_SERVICE_ACCOUNT_TOKEN="$TOKEN"
  token_reads_vault || { echo "The fetched token cannot read the project vault; tell the project owner." >&2; exit 1; }
  echo "✓ Token saved to .fnox/env (ignored by git)."
fi
fnox check
'''

[tasks.install]
description = "Install project dependencies and restore agent skills"
run = '''
set -eu
if [ -f package.json ]; then
  if [ -f pnpm-lock.yaml ]; then
    pnpm install --frozen-lockfile
  else
    pnpm install --no-frozen-lockfile
  fi
fi
node scripts/restore-skills.mjs
'''

[tasks.dev]
description = "Baseline checks; adapt to the project's real development loop"
run = '''
set -eu
mise run lint
mise run test
'''

[tasks.lint]
description = "Run the project linter; fail until a real check is configured"
run = '''
set -eu
if [ ! -f package.json ]; then
  echo "No lint command configured: adapt this baseline to the project brief." >&2
  exit 1
fi
pnpm run lint
'''

[tasks.test]
description = "Run project tests; do not report an untested scaffold as passing"
run = '''
set -eu
if [ ! -f package.json ]; then
  echo "No test command configured: add real behavior checks, not placeholder tests." >&2
  exit 1
fi
pnpm run test
'''

[tasks.deploy]
description = "Unconfigured release path; adapt explicitly before deployment"
run = '''
set -eu
echo "No deployment configured: record the target and approval gate before wiring CI." >&2
echo "For a non-deploying repository, replace this task with its explicit reason." >&2
exit 1
'''

[tasks."secrets:check"]
description = "Verify declared secrets resolve"
run = "fnox check"

[tasks."secrets:list"]
description = "List declared secrets"
run = "fnox list"
