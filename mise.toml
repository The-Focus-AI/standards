[tools]
fnox = { version = "1.45.0", workflow = "release.yml" }
node = "24.18.0"
ripgrep = "latest"
fd = "latest"
"npm:firecrawl-cli" = "1.16.2"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "0.24.0"
"npm:skills" = "1.7.4"
gh = "latest"
op = "2.41.1"
python = "3.13.18"
jq = "1.8.1"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "Check the bootstrap token injected into this cloud environment"
run = '''
set -eu
if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ]; then
  echo "Set OP_SERVICE_ACCOUNT_TOKEN in this project's cloud secret settings using your 1Password account." >&2
  exit 1
fi
echo "Bootstrap token is available; run mise run secrets:check to verify access."
'''

[tasks."secrets:check"]
description = "Verify every declared secret resolves cleanly"
run = "fnox check"

[tasks."secrets:list"]
description = "List all declared secrets and where they resolve from"
run = "fnox list"

[tasks."secrets:rotate-token"]
description = "Local exception only: refresh .fnox/env from personal 1Password access"
run = '''
set -eu
git check-ignore -q -- .fnox/env || { echo "Ignore .fnox/env before writing it" >&2; exit 1; }
if [ -n "$(git ls-files -- .fnox/env)" ]; then
  echo "STOP: .fnox/env is tracked; do not write credentials" >&2
  exit 1
fi
umask 077
mkdir -p .fnox
chmod 700 .fnox
TOKEN="$(op read 'op://thefocus/standards service account token/credential')"
printf 'OP_SERVICE_ACCOUNT_TOKEN=%s\n' "$TOKEN" > .fnox/env
chmod 600 .fnox/env
echo "✓ .fnox/env refreshed."
'''

[tasks.install]
description = "Restore agent skills from the committed lock"
run = "node scripts/restore-skills.mjs"

[tasks.dev]
description = "Run lint + test in development mode"
run = '''
set -eu
mise run lint
mise run test
'''

[tasks.lint]
description = "Offline static checks: markdown, skills, DESIGN.md, renderer, and STD-006"
run = '''
set -eu
echo "==> Linting markdown..."
markdownlint-cli2 "**/*.md" "#node_modules" "#.pi" "#.agents" || {
  echo "  ✗ Markdown lint failed"
  exit 1
}
echo "  ✓ Markdown OK"
echo ""
echo "==> Validating skills..."
node scripts/check-skills.mjs || {
  echo "  ✗ Skill validation failed"
  exit 1
}
node scripts/restore-skills.mjs --validate-lock
cmp skills-lock.json templates/default-project/skills-lock.json
echo ""
echo "==> Validating DESIGN.md..."
node scripts/validate-design.mjs
echo ""
echo "==> Rendering the site (STD-001 for standards, STD-006 for everything else)..."
node scripts/render-standard.mjs
echo ""
echo "==> Checking documents conform to STD-006..."
node scripts/validate-documents.mjs
'''

[tasks."skills:check"]
description = "Validate every skill under skills/ (frontmatter, naming, reference paths)"
run = "node scripts/check-skills.mjs"

[tasks."lint:fix"]
description = "Auto-fix markdown lint violations"
run = '''
set -eu
echo "==> Auto-fixing markdown..."
markdownlint-cli2 --fix "**/*.md" "#node_modules" "#.pi" "#.agents"
echo "  ✓ Fixes applied"
'''

[tasks.test]
description = "Run offline behavior and bootstrap tests (no credentials or Docker)"
run = '''
set -eu
node --test tests/test-*.mjs
bash tests/test-bootstrap.sh
'''

[tasks."test:docker"]
description = "Integration: build and smoke-test the agent image (Docker and network required)"
run = '''
set -eu
echo "==> Integration tests (docker build + smoke)..."
./tests/test-dockerfile.sh "$@"
'''

[tasks.deploy]
description = "Explain the CI-only deployment path; never publish from this workspace"
run = '''
set -eu
echo "No deployment performed: GitHub Actions pages.yml publishes main (STD-008 §3.10)." >&2
echo "After the recorded release approval, an authorized operator may dispatch: gh workflow run pages.yml --ref main" >&2
echo "Use mise run standard:render for a build-only check; it does not verify deployment." >&2
exit 1
'''

[tasks."deploy:status"]
description = "Which target the site deploys to, and the state of the last run"
run = '''
set -eu
echo "target:  github-pages environment on The-Focus-AI/standards"
echo "url:     https://the-focus-ai.github.io/standards/"
echo ""
gh run list --workflow pages.yml --limit 5 2>/dev/null \
  || echo "(gh not available or not authenticated — see the Actions tab)"
'''

[tasks."standard:render"]
description = "Render the whole corpus to out/standards/ and check conformance"
run = "node scripts/render-standard.mjs"

[tasks."standard:preview"]
description = "Render the corpus and serve the site at http://localhost:8900/"
run = '''
set -eu
node scripts/render-standard.mjs
echo "==> http://localhost:8900/"
python3 -m http.server -d out/standards 8900
'''

[tasks."docs:validate"]
description = "Validate guides, notes, decisions and prompts against STD-006"
run = "node scripts/validate-documents.mjs"

[tasks."design:validate"]
description = "Validate DESIGN.md: token references, WCAG AA pairs, and the measured-contrast table"
run = "node scripts/validate-design.mjs"

[tasks."generate:dockerfile"]
description = "Run pi in batch mode with the generate-dockerfile prompt"
run = '''
#!/usr/bin/env bash
set -euo pipefail

echo "==> Generating Dockerfile (streaming progress)..."
echo ""

pi --mode json -p "$(cat prompts/PRM-001-generate-dockerfile.md)" | jq -R -r '
  fromjson? |
  if .type == "tool_execution_start" then
    if .toolName == "read" then
      "\n📖 read: \(.args.path // "?")"
    elif .toolName == "bash" then
      "\n🔧 run: \(.args.command // "?" | split("\n")[0])"
    elif .toolName == "write" then
      "\n✏️  write: \(.args.path // "?")"
    elif .toolName == "edit" then
      "\n✏️  edit: \(.args.path // "?")"
    else
      "\n⚙️  \(.toolName)"
    end
  elif .type == "tool_execution_end" then
    if .isError then "  ❌ FAILED" else "  ✓" end
  elif .type == "message_update" then
    if .assistantMessageEvent.type == "thinking_delta" then
      "💭 \(.assistantMessageEvent.delta)"
    elif .assistantMessageEvent.type == "text_delta" then
      .assistantMessageEvent.delta
    else empty end
  elif .type == "agent_end" then
    "\n==> Done."
  else
    empty
  end
'

echo ""
echo "Run 'mise run test:docker' to build and smoke-test the image (requires Docker and network)."
'''
