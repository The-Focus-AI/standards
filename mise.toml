[tools]
fnox = "latest"
node = "24.18.0"
ripgrep = "latest"
fd = "latest"
"npm:firecrawl-cli" = "1.16.2"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:skills" = "1.5.13"
gh = "latest"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "First-time onboarding: pulls SA token from 1Password into .fnox/env"
run = '''
set -euo pipefail
mkdir -p .fnox && chmod 700 .fnox
if [ -f .fnox/env ]; then
  echo "✓ .fnox/env already exists — skipping"
  exit 0
fi
TOKEN="$(op read 'op://thefocus/standards service account token/credential')"
printf 'OP_SERVICE_ACCOUNT_TOKEN=%s\n' "$TOKEN" > .fnox/env
chmod 600 .fnox/env
echo "✓ .fnox/env written. Open a new shell tab."
'''

[tasks."secrets:check"]
description = "Verify every declared secret resolves cleanly"
run = "fnox check"

[tasks."secrets:list"]
description = "List all declared secrets and where they resolve from"
run = "fnox list"

[tasks."secrets:rotate-token"]
description = "Re-pull SA token from 1Password (overwrites .fnox/env)"
run = '''
set -euo pipefail
TOKEN="$(op read 'op://thefocus/standards service account token/credential')"
printf 'OP_SERVICE_ACCOUNT_TOKEN=%s\n' "$TOKEN" > .fnox/env
chmod 600 .fnox/env
echo "✓ .fnox/env refreshed."
'''

[tasks.install]
description = "Install tools and skills needed for the project"
run = "skills experimental_install"

[tasks.dev]
description = "Run lint + test in development mode"
run = '''
set -euo pipefail
mise run lint
mise run test
'''

[tasks.lint]
description = "Run all linters (markdownlint, mise doctor, fnox check)"
run = '''
set -euo pipefail
echo "==> Linting markdown..."
npx markdownlint-cli2 "**/*.md" "#node_modules" "#.pi" "#.agents" || {
  echo "  ✗ Markdown lint failed"
  exit 1
}
echo "  ✓ Markdown OK"
echo ""
echo "==> Validating mise config..."
mise doctor
echo "  ✓ mise config OK"
echo ""
echo "==> Checking fnox secrets..."
fnox check
echo "  ✓ fnox secrets OK"
'''

[tasks."lint:fix"]
description = "Auto-fix markdown lint violations"
run = '''
set -euo pipefail
echo "==> Auto-fixing markdown..."
npx markdownlint-cli2 --fix "**/*.md" "#node_modules" "#.pi" "#.agents"
echo "  ✓ Fixes applied"
'''

[tasks.test]
description = "Run Dockerfile integration tests (docker build + smoke)"
run = '''
echo "==> Integration tests (docker build + smoke)..."
./tests/test-dockerfile.sh "$@"
'''

[tasks.deploy]
description = "Deploy standards"
run = '''
echo "==> Deploy: Standards are reference-only, nothing to deploy."
'''

[tasks."generate:dockerfile"]
description = "Run pi in batch mode with the generate-dockerfile prompt"
run = '''
set -euo pipefail

echo "==> Generating Dockerfile (streaming progress)..."
echo ""

pi --mode json -p "$(cat prompts/generate-dockerfile.md)" 2>/dev/null | jq -R -r '
  fromjson? |
  if .type == "tool_execution_start" then
    if .toolName == "read" then
      "\n📖 read: \(.args.path // "?")"
    elif .toolName == "bash" then
      "\n🔧 run: \(.args.command // "?" | split("\n")[0])"
    elif .toolName == "write" then
      "\n✏️  write: \(.args.path // "?")"
    elif .toolName == "edit" then
      "\n✏️  edit: \(.args.path // "?")"
    else
      "\n⚙️  \(.toolName)"
    end
  elif .type == "tool_execution_end" then
    if .isError then "  ❌ FAILED" else "  ✓" end
  elif .type == "message_update" then
    if .assistantMessageEvent.type == "thinking_delta" then
      "💭 \(.assistantMessageEvent.delta)"
    elif .assistantMessageEvent.type == "text_delta" then
      .assistantMessageEvent.delta
    else empty end
  elif .type == "agent_end" then
    "\n==> Done."
  else
    empty
  end
'

echo ""
echo "Run 'mise test' to validate, or 'docker build -t standards .' to build."
'''
